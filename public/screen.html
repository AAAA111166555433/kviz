<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMSS kviz — veliki ekran</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="fx.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; font-size: clamp(13px, 1.12vw, 30px); }
  .wrap { height: 100vh; display: grid; grid-template-rows: auto 1fr; padding: 2.4vh 3vw 3vh; gap: 2vh; }

  /* zaglavlje */
  header { display: flex; align-items: center; gap: 1rem; }
  .brand { display: flex; align-items: center; gap: .8rem; }
  .mark { width: 2.7rem; height: 2.7rem; border-radius: .8rem; background: var(--g-brand); display: grid; place-items: center; box-shadow: 0 8px 24px -6px rgba(96, 165, 250, .6); }
  .mark svg { width: 60%; height: 60%; }
  .brand .t { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .brand .s { font-size: .9rem; color: var(--ink-3); font-weight: 600; }
  header .sp { flex: 1; }
  .hpill { display: inline-flex; align-items: center; gap: .55rem; padding: .55rem 1.05rem; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); font-weight: 700; font-size: 1rem; }
  .hpill b { font-variant-numeric: tabular-nums; }
  .mini-qr { display: flex; align-items: center; gap: .7rem; padding: .35rem .9rem .35rem .35rem; border-radius: 1rem; background: var(--glass); border: 1px solid var(--glass-line); font-size: .82rem; color: var(--ink-2); line-height: 1.25; }
  .mini-qr .q { width: 3.6rem; border-radius: .55rem; overflow: hidden; background: #fff; padding: .2rem; }
  .mini-qr svg { display: block; }
  .mini-qr b { color: var(--ink); font-size: .95rem; }
  .content { min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ---------- početni ekran / lobby ---------- */
  .hero { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; gap: 4vw; align-items: center; }
  .hero h1 { font-size: 5.1rem; line-height: .98; letter-spacing: -.045em; margin: 1.4rem 0 1.2rem; font-weight: 800; }
  .hero .lead { font-size: 1.45rem; color: var(--ink-2); margin: 0 0 2.2rem; max-width: 34em; font-weight: 500; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2.4rem; }
  .step { padding: 1.1rem 1.2rem; }
  .step .n { width: 2.3rem; height: 2.3rem; border-radius: .7rem; display: grid; place-items: center; font-weight: 800; background: var(--g-brand); color: #0b1030; margin-bottom: .7rem; }
  .step div { font-size: 1.1rem; font-weight: 700; line-height: 1.25; }
  .counter-row { display: flex; align-items: center; gap: 1.6rem; }
  .bigcount { font-size: 4.6rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .counter-row .lbl { font-size: 1.15rem; color: var(--ink-2); line-height: 1.3; font-weight: 600; }
  .recent { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.4rem; min-height: 2.8rem; max-height: 6.4rem; overflow: hidden; }
  .rp { display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .85rem .4rem .45rem; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--glass-line); font-weight: 700; font-size: 1rem; }
  .rp .emoji { font-size: 1.35rem; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: rgba(255, 255, 255, .1); display: grid; place-items: center; }
  .rp.new { animation: pop .6s cubic-bezier(.2, .8, .2, 1) both; border-color: rgba(52, 211, 153, .6); box-shadow: 0 0 24px -4px rgba(52, 211, 153, .5); }
  .qr-side { display: grid; justify-items: center; gap: 1.4rem; }
  .qr-frame { position: relative; padding: 6px; border-radius: 2rem; overflow: hidden; width: min(31vw, 56vh); }
  .qr-frame::before { content: ""; position: absolute; inset: -50%; background: conic-gradient(from 0deg, #a78bfa, #60a5fa, #22d3ee, #ec4899, #fbbf24, #a78bfa); animation: spin 6s linear infinite; }
  .qr-frame .in { position: relative; background: #fff; border-radius: 1.65rem; padding: 1.3rem; }
  .qr-frame svg { display: block; width: 100%; height: auto; }
  .qr-glow { position: absolute; inset: 10%; background: var(--g-brand); filter: blur(60px); opacity: .5; z-index: -1; }
  .join-url { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }
  .join-url small { display: block; text-align: center; font-size: .9rem; color: var(--ink-3); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-bottom: .2rem; }
  .floaters { position: absolute; inset: -3vh -3vw; pointer-events: none; z-index: -1; overflow: hidden; }
  .floaters span { position: absolute; font-size: 4rem; opacity: .13; animation: floaty 7s ease-in-out infinite; filter: saturate(.7); }

  /* ---------- pitanje ---------- */
  .qtopbar { display: flex; align-items: center; gap: 1.2rem; }
  .progress { flex: 1; height: .8rem; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--g-brand); box-shadow: 0 0 18px rgba(96, 165, 250, .7); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .anscount { font-weight: 700; color: var(--ink-2); font-size: 1.1rem; white-space: nowrap; }
  .anscount b { color: var(--ink); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .qmain { display: flex; align-items: center; gap: 2.4rem; margin: 2.6vh 0 3vh; min-height: 22vh; }
  .qtext { flex: 1; font-size: 3.15rem; font-weight: 800; line-height: 1.12; letter-spacing: -.03em; margin: 0; animation: focusin .7s cubic-bezier(.2, .8, .2, 1) both; text-wrap: balance; }
  .ring { position: relative; width: 10rem; height: 10rem; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); filter: drop-shadow(0 0 14px rgba(96, 165, 250, .55)); }
  .ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3.6rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
  .ring.low .n { color: var(--bad2); animation: pop .5s infinite alternate; }
  .ring.low svg { filter: drop-shadow(0 0 18px rgba(251, 113, 133, .8)); }
  .timesup { flex: none; font-size: 1.7rem; font-weight: 800; padding: 1rem 1.6rem; border-radius: 1.2rem; background: rgba(251, 191, 36, .14); border: 1px solid rgba(251, 191, 36, .5); color: #fde68a; animation: pop .5s both; }
  .opts4 { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 1.8vh 1.4vw; min-height: 0; }
  .sopt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 1.3rem; padding: 1.4rem 1.8rem; border-radius: 1.6rem; background: var(--og);
    font-size: 2.1rem; font-weight: 800; letter-spacing: -.02em; color: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 24px 50px -24px var(--oc);
    animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; transition: transform .6s cubic-bezier(.2, .8, .2, 1), opacity .5s, filter .5s, box-shadow .6s; }
  .sopt::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .22), transparent); animation: shine 3.2s ease-in-out infinite; animation-delay: inherit; }
  .sopt .badge { font-size: 1.6rem; }
  .sopt .letter { font-size: 1.15rem; font-weight: 800; opacity: .75; }
  .sopt .lbl { flex: 1; position: relative; z-index: 1; text-shadow: 0 2px 12px rgba(0, 0, 0, .25); }
  .sopt .cnt { position: relative; z-index: 1; text-align: right; line-height: 1; font-variant-numeric: tabular-nums; }
  .sopt .cnt small { display: block; font-size: 1.05rem; opacity: .85; margin-top: .3rem; font-weight: 700; }
  .sopt .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255, 255, 255, .17); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
  .sopt > * { position: relative; z-index: 1; }
  .sopt .bar { z-index: 0; position: absolute; }
  .reveal .sopt:not(.correct) { opacity: .32; filter: saturate(.25); transform: scale(.97); }
  .reveal .sopt.correct { transform: scale(1.025); box-shadow: 0 0 0 .3rem #fff, 0 0 80px -6px var(--oc); z-index: 2; }
  .stamp { position: absolute; top: .8rem; right: 1rem; z-index: 3 !important; font-size: .95rem; font-weight: 800; letter-spacing: .12em; background: #fff; color: #0b1030; padding: .35rem .8rem; border-radius: 999px; animation: pop .6s .3s both; }

  /* ---------- naslov sekcija ---------- */
  .vtitle { text-align: center; margin: 0 0 2.4vh; }
  .vtitle h2 { font-size: 3.1rem; letter-spacing: -.04em; margin: .9rem 0 0; font-weight: 800; line-height: 1.05; }

  /* ---------- rang-lista: podijum ---------- */
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 1.6vw; max-width: 66vw; width: 100%; margin: 0 auto; height: 44vh; }
  .pcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
  .pav { position: relative; width: 6.4rem; height: 6.4rem; border-radius: 50%; display: grid; place-items: center; font-size: 3.6rem; background: rgba(255, 255, 255, .08); margin-bottom: .7rem; }
  .pav::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; padding: 4px; background: var(--medal); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .p1 .pav { width: 8rem; height: 8rem; font-size: 4.6rem; box-shadow: 0 0 60px -6px rgba(251, 191, 36, .7); }
  .crown { position: absolute; top: -2.4rem; font-size: 2.6rem; animation: floaty 3s ease-in-out infinite; }
  .pname { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ppts { font-size: 1.25rem; color: var(--ink-2); font-weight: 700; margin-bottom: .9rem; font-variant-numeric: tabular-nums; }
  .pbase { width: 100%; border-radius: 1.3rem 1.3rem .4rem .4rem; background: var(--medal); display: grid; place-items: start center; padding-top: 1rem; font-size: 3.6rem; font-weight: 800; color: rgba(11, 16, 48, .75);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 30px 60px -30px var(--medal-c); }
  .p1 { --medal: linear-gradient(160deg, #fde68a, #f59e0b 60%, #b45309); --medal-c: #f59e0b; }
  .p2 { --medal: linear-gradient(160deg, #f1f5f9, #94a3b8 60%, #475569); --medal-c: #94a3b8; }
  .p3 { --medal: linear-gradient(160deg, #fed7aa, #c2410c 65%, #7c2d12); --medal-c: #c2410c; }
  .p1 .pbase { height: 45%; } .p2 .pbase { height: 32%; } .p3 .pbase { height: 22%; }
  .rest { display: grid; grid-template-columns: 1fr 1fr; gap: 1vh 1.4vw; max-width: 66vw; width: 100%; margin: 3vh auto 0; }
  .rrow { display: grid; grid-template-columns: 2.6rem 2.8rem 1fr auto; align-items: center; gap: .8rem; padding: .7rem 1.1rem; font-size: 1.35rem; animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
  .rrow .rk { color: var(--ink-3); font-weight: 800; }
  .rrow .emoji { font-size: 1.9rem; }
  .rrow .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .pt { font-weight: 800; font-variant-numeric: tabular-nums; }

  /* ---------- životinje ---------- */
  .race { display: grid; gap: 1.05vh; max-width: 82vw; width: 100%; margin: 0 auto; }
  .lane { display: grid; grid-template-columns: 2.6rem 4rem 8.5rem 1fr 13rem; align-items: center; gap: 1rem; animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
  .lane .rk { font-weight: 800; color: var(--ink-3); font-size: 1.4rem; text-align: right; }
  .lane .av { position: relative; width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center; font-size: 2.1rem; background: rgba(255, 255, 255, .08); border: 1px solid var(--glass-line); }
  .lane .av .crown { top: -1.6rem; font-size: 1.6rem; }
  .lane .nm { font-weight: 800; font-size: 1.45rem; letter-spacing: -.02em; }
  .track { height: 3rem; border-radius: .9rem; background: rgba(255, 255, 255, .06); overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0; border-radius: .9rem; background: linear-gradient(90deg, #6366f1, #60a5fa 60%, #22d3ee); display: flex; align-items: center; justify-content: flex-end; padding-right: 1rem; font-weight: 800; font-size: 1.4rem;
    transition: width 1.4s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 0 24px -6px rgba(96, 165, 250, .8); min-width: 0; }
  .lane.lead .fill { background: linear-gradient(90deg, #f59e0b, #fbbf24 60%, #fde68a); color: #3b2300; box-shadow: 0 0 34px -4px rgba(251, 191, 36, .9); }
  .lane .zero { position: absolute; left: 1rem; top: 0; bottom: 0; display: flex; align-items: center; color: var(--ink-3); font-weight: 800; font-size: 1.3rem; }
  .lane .side { color: var(--ink-3); font-size: 1rem; text-align: right; font-weight: 600; line-height: 1.3; }
  .lane .side b { color: var(--ink-2); }
  .race-head { display: grid; grid-template-columns: 2.6rem 4rem 8.5rem 1fr 13rem; gap: 1rem; color: var(--ink-3); font-size: .9rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  /* ---------- statistika ---------- */
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(0, auto); gap: 1.3vw; max-width: 86vw; width: 100%; margin: 0 auto; }
  .tile { padding: 1.5rem 1.6rem; animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; position: relative; overflow: hidden; }
  .tile .v { font-size: 3.6rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .l { color: var(--ink-2); font-size: 1.05rem; font-weight: 600; margin-top: .5rem; }
  .tile .qt { font-size: 1.25rem; font-weight: 700; margin-top: .9rem; line-height: 1.3; }
  .tile.span2 { grid-column: span 2; }
  .tile .meter { height: .6rem; border-radius: 999px; background: rgba(255, 255, 255, .08); margin-top: 1rem; overflow: hidden; }
  .tile .meter i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 1.4s .4s cubic-bezier(.2, .8, .2, 1); }
  .tile .big-emoji { position: absolute; right: 1.2rem; top: 50%; transform: translateY(-50%); font-size: 5.4rem; opacity: .95; }
  .tile.hl { background: linear-gradient(140deg, rgba(139, 92, 246, .28), rgba(59, 130, 246, .14)); }

  .empty { text-align: center; color: var(--ink-3); font-size: 1.6rem; margin-top: 10vh; }
  .fsbtn { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity .2s; background: var(--glass-2); color: #fff; border: 1px solid var(--glass-line); border-radius: .8rem; padding: .5rem .9rem; font-size: .9rem; }
  body.mouse .fsbtn { opacity: 1; }
  .offline { position: fixed; top: 0; left: 0; right: 0; background: #b45309; color: #fff; text-align: center; padding: .35rem; font-size: .9rem; z-index: 50; }
  .ver { position: fixed; right: 1rem; bottom: .7rem; font-size: .75rem; color: var(--ink-3); opacity: .6; }
</style>
</head>
<body class="stage-theme">
<div class="offline" id="offline" hidden>Veza sa serverom je prekinuta — ponovo se povezujem…</div>
<button class="fsbtn" id="fs" type="button">⛶ Ceo ekran</button>
<div class="ver" id="ver"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="#0b1030"><rect x="3" y="13" width="4" height="8" rx="1.2"/><rect x="10" y="8" width="4" height="13" rx="1.2"/><rect x="17" y="3" width="4" height="18" rx="1.2"/></svg></div>
      <div><div class="t" id="title">DMSS kviz</div><div class="s" id="subtitle"></div></div>
    </div>
    <div class="sp"></div>
    <div class="hpill" id="sessChip" hidden></div>
    <div class="hpill">👥 <b id="regNum">0</b> <span style="color:var(--ink-2);font-weight:600">prijavljenih</span></div>
    <div class="mini-qr" id="miniQr" hidden></div>
  </header>
  <section class="content" id="content"></section>
</div>

<script src="vendor/qrcode.js"></script>
<script src="common.js"></script>
<script src="fx.js"></script>
<script>
'use strict';
let CFG, STATE, RECEIVED = 0, raf = 0, viewKey = '', prevRegistered = 0, seenRecent = new Set();
const content = $('#content');
mountBackdrop();

let mouseT; addEventListener('mousemove', () => { document.body.classList.add('mouse'); clearTimeout(mouseT); mouseT = setTimeout(() => document.body.classList.remove('mouse'), 2500); });
$('#fs').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); };
function animal(id) { return CFG.animals.find(a => a.id === id) || { emoji: '❔', name: id }; }
function joinShort() { return CFG.joinUrl.replace(/^https?:\/\//, '').replace(/\/$/, ''); }

async function boot() {
  CFG = await api('/api/config');
  $('#title').textContent = CFG.title;
  $('#subtitle').textContent = CFG.subtitle || '';
  $('#ver').textContent = 'v' + CFG.version;
  $('#miniQr').innerHTML = `<div class="q">${qrSvg(CFG.joinUrl, { margin: 1 })}</div><div>Pridružite se<br><b>${esc(joinShort())}</b></div>`;
  connectStream({
    onState: (s, at) => { STATE = s; RECEIVED = at; render(); },
    onCount: c => { if (STATE && STATE.question && c.questionId === STATE.question.id) { STATE.answered = c.answered; updateAnswered(); } },
    onStatus: ok => { $('#offline').hidden = ok; },
  });
}

function render() {
  const s = STATE;
  // zaglavlje
  const reg = $('#regNum');
  if (s.registered !== prevRegistered) { countUp(reg, s.registered, { from: prevRegistered, duration: 700 }); }
  $('#sessChip').hidden = !s.session;
  if (s.session) $('#sessChip').innerHTML = `<span class="live-dot"></span> ${esc(s.session.name)}`;
  $('#miniQr').hidden = ['idle', 'lobby'].includes(s.phase);

  const key = s.phase + ':' + s.seq;
  if (key === viewKey) {
    if (['idle', 'lobby'].includes(s.phase)) updateWelcome();
    prevRegistered = s.registered;
    return;
  }
  viewKey = key;
  cancelAnimationFrame(raf);
  Confetti.clear();
  switch (s.phase) {
    case 'idle': case 'lobby': renderWelcome(); break;
    case 'question': case 'closed': case 'reveal': renderQuestion(); break;
    case 'board': renderBoard(); break;
    case 'animals': renderAnimals(); break;
    case 'stats': renderStats(); break;
  }
  prevRegistered = s.registered;
}

/* ---------------- početni / lobby ---------------- */
function renderWelcome() {
  const s = STATE, lobby = s.phase === 'lobby';
  const fl = CFG.animals.map((a, i) => {
    const x = (i * 97) % 100, y = (i * 53 + 17) % 90, d = (i % 5) * 1.1;
    return `<span class="emoji" style="left:${x}%;top:${y}%;animation-delay:-${d}s;font-size:${3 + (i % 3)}rem">${a.emoji}</span>`;
  }).join('');
  content.innerHTML = `<div class="view">
    <div class="floaters">${fl}</div>
    <div class="hero">
      <div>
        <span class="eyebrow rise"><span class="live-dot"></span>${lobby ? esc(s.session.name) : 'Kviz uživo · ' + esc(CFG.subtitle || '')}</span>
        <h1 class="rise" style="animation-delay:.08s">${lobby ? `<span class="grad-text">Kviz počinje</span><br>za koji trenutak` : `Ko zna više?<br><span class="grad-text">Igrajte sa nama!</span>`}</h1>
        <p class="lead rise" style="animation-delay:.16s">${lobby ? 'Prijavite se ako već niste — brži tačan odgovor donosi više bodova.' : esc(CFG.scheduleNote || 'Prijavite se odmah — traje 20 sekundi.')}</p>
        <div class="steps">
          ${['Skenirajte QR kod telefonom', 'Izaberite životinju i nadimak', 'Smislite PIN od 4 cifre'].map((t, i) =>
            `<div class="step glass rise" style="animation-delay:${.24 + i * .08}s"><div class="n">${i + 1}</div><div>${t}</div></div>`).join('')}
        </div>
        <div class="counter-row rise" style="animation-delay:.5s"><div class="bigcount grad-text" id="bigCount">0</div><div class="lbl">prijavljenih<br>učesnika</div></div>
        <div class="recent" id="recent"></div>
      </div>
      <div class="qr-side pop" style="animation-delay:.2s">
        <div style="position:relative"><div class="qr-glow"></div><div class="qr-frame"><div class="in">${qrSvg(CFG.joinUrl, { margin: 1 })}</div></div></div>
        <div class="join-url"><small>ili otvorite</small>${esc(joinShort())}</div>
      </div>
    </div></div>`;
  countUp($('#bigCount'), s.registered, { duration: 1200 });
  seenRecent = new Set();
  updateRecent(false);
}
function updateWelcome() {
  const el = $('#bigCount');
  if (el && STATE.registered !== prevRegistered) countUp(el, STATE.registered, { from: prevRegistered, duration: 700 });
  updateRecent(true);
}
function updateRecent(animate) {
  const box = $('#recent'); if (!box) return;
  const list = (STATE.recent || []).slice(0, 10);
  box.innerHTML = list.map(r => {
    const k = r.animal + '|' + r.nickname;
    const isNew = animate && !seenRecent.has(k);
    return `<span class="rp ${isNew ? 'new' : ''}"><span class="emoji">${animal(r.animal).emoji}</span>${esc(r.nickname)}</span>`;
  }).join('');
  list.forEach(r => seenRecent.add(r.animal + '|' + r.nickname));
}

/* ---------------- pitanje ---------------- */
function updateAnswered() {
  const s = STATE;
  const a = $('#answered'); if (a) a.textContent = fmtNum(s.answered || 0);
  const p = $('#progress'); if (p) p.style.width = Math.min(100, (s.answered || 0) / Math.max(1, s.registered) * 100) + '%';
}
function renderQuestion() {
  const s = STATE, q = s.question;
  if (!q) return;
  const reveal = s.phase === 'reveal', closed = s.phase !== 'question';
  const counts = s.counts || [];
  const total = counts.reduce((a, b) => a + b, 0);
  const max = Math.max(1, ...counts);
  content.innerHTML = `<div class="view ${reveal ? 'reveal' : ''}">
    <div class="qtopbar">
      <span class="eyebrow">Pitanje ${q.index} / ${q.total}</span>
      <div class="progress"><i id="progress"></i></div>
      <span class="anscount"><b id="answered">0</b> / ${fmtNum(s.registered)} odgovora</span>
    </div>
    <div class="qmain">
      <h2 class="qtext">${esc(q.text)}</h2>
      ${closed
        ? (reveal ? `<div class="timesup" style="background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5);color:#a7f3d0">✓ ${total ? fmtPct((counts[q.correct] || 0) / total) : '0%'} tačnih</div>`
                  : `<div class="timesup">⏱ Vreme je isteklo</div>`)
        : `<div class="ring" id="ring">${ringSvg('rg')}<div class="n" id="secs"></div></div>`}
    </div>
    <div class="opts4">${q.options.map((o, i) => `
      <div class="sopt fx-${'abcd'[i]} ${reveal && i === q.correct ? 'correct' : ''}" style="animation-delay:${.15 + i * .09}s" id="opt${i}">
        ${closed ? `<div class="bar" data-w="${(counts[i] || 0) / max * 100}"></div>` : ''}
        <span class="badge">${shapeHtml(i)}</span><span class="letter">${LETTERS[i]}</span>
        <span class="lbl">${esc(o)}</span>
        ${closed ? `<span class="cnt">${fmtNum(counts[i] || 0)}<small>${total ? fmtPct((counts[i] || 0) / total) : '0%'}</small></span>` : ''}
        ${reveal && i === q.correct ? '<span class="stamp">TAČNO</span>' : ''}
      </div>`).join('')}</div>
  </div>`;
  updateAnswered();
  requestAnimationFrame(() => requestAnimationFrame(() => $$('.bar').forEach(b => b.style.width = b.dataset.w + '%')));
  if (reveal) setTimeout(() => Confetti.fromElement($('#opt' + q.correct), { count: 160, spread: 1.6, power: 16 }), 650);
  if (closed) return;
  const remaining = makeDeadline(q.remainingMs, RECEIVED), tot = q.timeLimit * 1000;
  const arc = $('#ring .arc'), C = Number(arc.dataset.c), secs = $('#secs'), ring = $('#ring');
  const tick = () => {
    const r = remaining();
    arc.style.strokeDashoffset = C * (1 - r / tot);
    secs.textContent = Math.ceil(r / 1000);
    ring.classList.toggle('low', r < 5000);
    if (r > 0) raf = requestAnimationFrame(tick);
  };
  tick();
}

/* ---------------- rang-lista ---------------- */
function scopeTitle(s, base) { return s.scope === 'all' ? `${base} — ukupno` : `${base} — ${esc(s.session ? s.session.name : '')}`; }
function renderBoard() {
  const s = STATE, rows = s.board || [];
  if (!rows.length) { content.innerHTML = `<div class="view"><div class="vtitle"><h2>${scopeTitle(s, 'Rang-lista')}</h2></div><p class="empty">Još nema odgovora.</p></div>`; return; }
  const top = rows.slice(0, 3), rest = rows.slice(3, 10);
  const order = [1, 0, 2]; // 2. levo, 1. u sredini, 3. desno
  const delays = { 0: 1.0, 1: .55, 2: .15 };
  content.innerHTML = `<div class="view">
    <div class="vtitle rise"><span class="eyebrow">🏆 ${s.scope === 'all' ? 'Sve sesije' : 'Ova sesija'}</span><h2>${s.scope === 'all' ? '<span class="grad-text">Ukupna rang-lista</span>' : `Rang-lista <span class="grad-text">${esc(s.session ? s.session.name : '')}</span>`}</h2></div>
    <div class="podium">${order.map(i => {
      const r = top[i]; if (!r) return '<div></div>';
      const a = animal(r.animal);
      return `<div class="pcol p${i + 1}" style="animation-delay:${delays[i]}s">
        <div class="pav emoji">${i === 0 ? '<span class="crown">👑</span>' : ''}${a.emoji}</div>
        <div class="pname">${esc(r.nickname)}</div>
        <div class="ppts"><span data-count="${r.points}" data-delay="${delays[i] * 1000 + 200}">0</span> bodova</div>
        <div class="pbase">${i + 1}</div></div>`;
    }).join('')}</div>
    <div class="rest">${rest.map((r, j) => `<div class="rrow glass" style="animation-delay:${1.5 + j * .07}s">
      <span class="rk">${r.rank}.</span><span class="emoji">${animal(r.animal).emoji}</span><span class="nm">${esc(r.nickname)}</span><span class="pt">${fmtNum(r.points)}</span></div>`).join('')}</div>
  </div>`;
  countAll(content);
  setTimeout(() => Confetti.rain(3), 1300);
}

/* ---------------- životinje ---------------- */
function renderAnimals() {
  const s = STATE, data = s.animals, rows = data.rows;
  const byAvg = data.rankBy === 'avgCorrect';
  const val = r => byAvg ? r.avgCorrect : r.correct;
  const max = Math.max(1e-9, ...rows.map(val));
  content.innerHTML = `<div class="view">
    <div class="vtitle rise"><span class="eyebrow">🦁 Takmičenje životinja</span><h2>${s.scope === 'all' ? 'Koja životinja je <span class="grad-text">najpametnija?</span>' : `Životinje — <span class="grad-text">${esc(s.session ? s.session.name : '')}</span>`}</h2></div>
    <div class="race">
      <div class="race-head"><span></span><span></span><span></span><span>${byAvg ? 'prosečno tačnih po igraču' : 'ukupno tačnih odgovora'}</span><span style="text-align:right">igrača · tačnost</span></div>
      ${rows.map((r, i) => {
        const v = val(r), lead = r.rank === 1 && v > 0;
        return `<div class="lane ${lead ? 'lead' : ''}" style="animation-delay:${.1 + i * .06}s">
          <span class="rk">${r.rank}.</span>
          <span class="av emoji">${lead ? '<span class="crown">👑</span>' : ''}${r.emoji}</span>
          <span class="nm">${esc(r.name)}</span>
          <div class="track">${v > 0 ? `<div class="fill" data-w="${Math.max(7, v / max * 100)}"><span data-count="${byAvg ? v : r.correct}" ${byAvg ? 'data-dec="1"' : ''} data-dur="1400" data-delay="${200 + i * 60}">0</span></div>` : '<span class="zero">0</span>'}</div>
          <span class="side"><b>${r.players}</b> igrača · <b>${r.answers ? fmtPct(r.accuracy) : '–'}</b></span>
        </div>`;
      }).join('')}
    </div></div>`;
  setTimeout(() => $$('.fill').forEach(f => f.style.width = f.dataset.w + '%'), 250);
  countAll(content);
}

/* ---------------- statistika ---------------- */
function renderStats() {
  const s = STATE, st = s.stats;
  const fa = st.fastest ? animal(st.fastest.animal) : null;
  const tile = (inner, cls = '', d = 0) => `<div class="tile glass ${cls}" style="animation-delay:${d}s">${inner}</div>`;
  const meter = (rate, grad) => `<div class="meter"><i data-w="${rate * 100}" style="background:${grad}"></i></div>`;
  content.innerHTML = `<div class="view">
    <div class="vtitle rise"><span class="eyebrow">📊 ${s.scope === 'all' ? 'Sve sesije' : esc(s.session ? s.session.name : '')}</span><h2>Statistička <span class="grad-text">priča kviza</span></h2></div>
    <div class="bento">
      ${tile(`<div class="v grad-text" data-count="${st.registered}">0</div><div class="l">prijavljenih učesnika</div>`, 'hl', .1)}
      ${tile(`<div class="v" data-count="${st.players}">0</div><div class="l">učesnika je odgovaralo</div>`, '', .18)}
      ${tile(`<div class="v" data-count="${st.answers}">0</div><div class="l">datih odgovora</div>`, '', .26)}
      ${tile(`<div class="v grad-text" data-count="${Math.round(st.accuracy * 100)}" data-suffix="%">0</div><div class="l">tačnih odgovora</div>${meter(st.accuracy, 'var(--g-brand)')}`, '', .34)}
      ${st.hardest ? tile(`<div class="v" style="color:var(--bad2)" data-count="${Math.round(st.hardest.rate * 100)}" data-suffix="%">0</div><div class="l">tačnih na najtežem pitanju</div><div class="qt">${esc(st.hardest.text)}</div>${meter(st.hardest.rate, 'var(--g-a)')}`, 'span2', .42) : ''}
      ${st.easiest ? tile(`<div class="v" style="color:var(--good)" data-count="${Math.round(st.easiest.rate * 100)}" data-suffix="%">0</div><div class="l">tačnih na najlakšem pitanju</div><div class="qt">${esc(st.easiest.text)}</div>${meter(st.easiest.rate, 'var(--g-d)')}`, 'span2', .5) : ''}
      ${st.fastest ? tile(`<div class="v"><span data-count="${st.fastest.ms / 1000}" data-dec="2">0</span> s</div><div class="l">najbrži tačan odgovor</div><div class="qt">${esc(st.fastest.nickname)}</div><span class="big-emoji emoji">${fa.emoji}</span>`, 'span2', .58) : ''}
      ${st.popularAnimal ? tile(`<div class="v">${esc(st.popularAnimal.name)}</div><div class="l">najpopularnija životinja · <b>${st.popularAnimal.n}</b> učesnika</div><span class="big-emoji emoji">${st.popularAnimal.emoji}</span>`, 'span2 hl', .66) : ''}
    </div></div>`;
  countAll(content);
  setTimeout(() => $$('.meter i').forEach(m => m.style.width = m.dataset.w + '%'), 300);
}

boot().catch(e => { content.innerHTML = `<div class="view"><p class="empty">Server nije dostupan<br><small>${esc(e.message)}</small></p></div>`; setTimeout(() => location.reload(), 5000); });
</script>
</body>
</html>
